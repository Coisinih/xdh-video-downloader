services:
  backend:
    build: ./backend
    environment:
      VIDNEST_DOWNLOAD_DIR: /data/downloads
      VIDNEST_ALLOWED_HOSTS: ${VIDNEST_ALLOWED_HOSTS:-}
      VIDNEST_MAX_FILE_SIZE_MB: ${VIDNEST_MAX_FILE_SIZE_MB:-2048}
      VIDNEST_MAX_CONCURRENT_DOWNLOADS: ${VIDNEST_MAX_CONCURRENT_DOWNLOADS:-2}
      VIDNEST_DATABASE_PATH: ${VIDNEST_DATABASE_PATH:-/data/vidnest.db}
      VIDNEST_SESSION_COOKIE_SECURE: ${VIDNEST_SESSION_COOKIE_SECURE:-false}
      VIDNEST_FRONTEND_URL: http://localhost:${VIDNEST_PORT:-8080}
      VIDNEST_STRIPE_SECRET_KEY: ${VIDNEST_STRIPE_SECRET_KEY:-}
      VIDNEST_STRIPE_WEBHOOK_SECRET: ${VIDNEST_STRIPE_WEBHOOK_SECRET:-}
      VIDNEST_STRIPE_ONE_TIME_PRICE_ID: ${VIDNEST_STRIPE_ONE_TIME_PRICE_ID:-}
      VIDNEST_STRIPE_SUBSCRIPTION_PRICE_ID: ${VIDNEST_STRIPE_SUBSCRIPTION_PRICE_ID:-}
      VIDNEST_STRIPE_AMOUNT_CENTS: ${VIDNEST_STRIPE_AMOUNT_CENTS:-990}
      VIDNEST_STRIPE_CURRENCY: ${VIDNEST_STRIPE_CURRENCY:-cny}
      VIDNEST_SUPPORT_EMAIL: ${VIDNEST_SUPPORT_EMAIL:-senwei0521@gmail.com}
      VIDNEST_DEEPSEEK_API_KEY: ${VIDNEST_DEEPSEEK_API_KEY:-}
      VIDNEST_DEEPSEEK_BASE_URL: ${VIDNEST_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      VIDNEST_DEEPSEEK_MODEL: ${VIDNEST_DEEPSEEK_MODEL:-deepseek-flash}
    volumes:
      - vidnest-downloads:/data/downloads
      - vidnest-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${VIDNEST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vidnest-downloads:
  vidnest-data:
